<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#040420" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AstroPets" />
  <title>AstroPets - Escolha sua Missão</title>
  <style>
    /* ============================================ */
    /* RESET E BASE                                 */
    /* ============================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: radial-gradient(1200px 600px at 10% 20%, rgba(4,4,32,0.45), transparent 40%),
                  linear-gradient(120deg, #040420 0%, #0b0b3a 45%, #1a1a59 100%);
      background-color: #040420;
      min-height: 100vh;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      color: #e7e9ff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ============================================ */
    /* HEADER / TÍTULO                              */
    /* ============================================ */
    .page-header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 20px 32px;
      width: 100%;
    }
    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      color: #90d0ff;
      text-shadow: 0 0 12px rgba(144, 208, 255, 0.35);
      letter-spacing: 0.5px;
    }
    .page-subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #a8c8f0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ============================================ */
    /* GRADE DE MISSÕES                             */
    /* ============================================ */
    .mission-grid {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: stretch;
      gap: 24px;
      width: 100%;
      max-width: 1180px;
      padding: 0 24px 60px;
      margin: auto;
    }

    .mission-square {
      flex: 1 1 0;
      max-width: 260px;
      min-width: 200px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(160deg, rgba(30, 30, 100, 0.85), rgba(10, 10, 50, 0.9));
      border: 2px solid rgba(230, 224, 91, 0.65);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      padding: 20px 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    /* Removida a animação infinita (float-mission) para reduzir estímulo visual */

    .mission-square::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent, #e6e05b);
      opacity: 0.9;
    }

    .mission-square:hover,
    .mission-square:focus-visible {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(144, 208, 255, 0.25);
      border-color: var(--accent, #e6e05b);
      outline: none;
    }

    .mission-square:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: 3px;
    }

    #mission-luna { --accent: #5b9eff; }
    #mission-bolt { --accent: #ff5c5c; }
    #mission-mimi { --accent: #c07bff; }
    #mission-tiko { --accent: #4ee04e; }

    .mission-emoji {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .pet-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent, #e6e05b);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .mission-name {
      font-size: 1rem;
      font-weight: 600;
      color: #e7e9ff;
      margin-bottom: 10px;
    }
    .mission-description {
      font-size: 0.78rem;
      color: #a8b4d9;
      line-height: 1.4;
      padding: 0 4px;
    }

    /* ============================================ */
    /* MODAIS                                       */
    /* ============================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 20, 0.92);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: linear-gradient(160deg, #101046 0%, #070730 100%);
      padding: 36px 32px 32px;
      border-radius: 22px;
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      overflow-y: auto;
      border: 1px solid rgba(144, 208, 255, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(144, 208, 255, 0.1) inset;
      text-align: center;
      position: relative;
    }

    .modal-content h2 {
      font-size: 1.5rem;
      color: #90d0ff;
      margin-bottom: 16px;
      padding-right: 30px;
      padding-left: 30px;
      line-height: 1.3;
    }
    .modal-content > p {
      font-size: 0.95rem;
      color: #a8c8f0;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .close-button {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 1.6rem;
      line-height: 1;
      color: #ff9a9a;
      cursor: pointer;
      width: 44px; height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s, transform 0.2s;
      user-select: none;
      border: none;
      background: transparent;
    }
    .close-button:hover {
      background: rgba(255, 154, 154, 0.15);
      transform: rotate(90deg);
    }
    .close-button:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: 2px;
    }

    .game-action-button {
      padding: 14px 32px;
      background: linear-gradient(135deg, #90d0ff, #6ab8ff);
      color: #040420;
      border: 2px solid transparent;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.05rem;
      margin-top: 24px;
      box-shadow: 0 6px 20px rgba(144, 208, 255, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.3px;
      min-height: 52px;
      min-width: 200px;
    }
    .game-action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(144, 208, 255, 0.45);
    }
    .game-action-button:active {
      transform: translateY(0);
    }
    .game-action-button:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: 3px;
    }

    /* CAIXA DE FEEDBACK (substitui o mimi-feedback solto) */
    .game-feedback {
      font-size: 1rem;
      font-weight: 500;
      color: #a8c8f0;
      margin: 16px auto;
      min-height: 3em;
      line-height: 1.5;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(144, 208, 255, 0.08);
      border: 1px solid rgba(144, 208, 255, 0.2);
      transition: background 0.25s, color 0.25s, border-color 0.25s;
      max-width: 560px;
    }
    .game-feedback.observing { color: #f2e884; background: rgba(242, 232, 132, 0.08); border-color: rgba(242, 232, 132, 0.3); }
    .game-feedback.your-turn { color: #90d0ff; background: rgba(144, 208, 255, 0.12); border-color: rgba(144, 208, 255, 0.4); }
    .game-feedback.success { color: #7ee87e; background: rgba(126, 232, 126, 0.1); border-color: rgba(126, 232, 126, 0.3); }
    .game-feedback.error { color: #ff9a9a; background: rgba(255, 154, 154, 0.1); border-color: rgba(255, 154, 154, 0.3); }

    /* ============================================ */
    /* LUNA — LINHA ÚNICA DE LUAS                   */
    /* ============================================ */
    .planets-grid {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 24px auto 8px;
      max-width: 100%;
    }
    .planet {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      background: radial-gradient(circle at 30% 30%, rgba(80, 142, 230, 0.35), rgba(20, 20, 70, 0.7));
      border: 2px solid rgba(144, 208, 255, 0.35);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      min-height: 96px;
      min-width: 96px;
    }
    .planet:hover {
      border-color: #90d0ff;
      transform: translateY(-3px);
    }
    .planet:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: 3px;
    }
    .planet.highlight {
      background: radial-gradient(circle at 30% 30%, #b5e0ff, #90d0ff);
      border-color: #ffffff;
      box-shadow: 0 0 24px #90d0ff;
      transform: scale(1.08);
    }
    .planet.error {
      background: radial-gradient(circle at 30% 30%, #ff8a8a, #ff4444);
      border-color: #ffaaaa;
      animation: shake 0.4s;
    }
    .planet.turn-active {
      border-color: #f2e884;
      box-shadow: 0 0 0 2px rgba(242, 232, 132, 0.25);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* ============================================ */
    /* BOLT e MIMI — LINHAS DE MATCH                */
    /* ============================================ */
    .match-container { margin: 8px 0; }
    .match-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .match-item {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(144, 208, 255, 0.28);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      color: #e7e9ff;
      min-width: 90px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.18s ease;
      user-select: none;
      letter-spacing: 0.4px;
    }
    .match-item:hover {
      border-color: #90d0ff;
      background: rgba(144, 208, 255, 0.15);
      transform: translateY(-2px);
    }
    .match-item:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: 3px;
    }
    .match-item.selected {
      border-color: #f2e884;
      background: rgba(242, 232, 132, 0.2);
      box-shadow: 0 0 18px rgba(242, 232, 132, 0.5);
      transform: translateY(-2px);
    }
    .match-item.matched {
      opacity: 0.22;
      cursor: default;
      pointer-events: none;
      border-color: #4ee04e;
    }

    .color-block-item {
      min-width: 90px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.25);
    }
    .color-block-item:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: #ffffff;
    }

    .extenso-item { font-size: 0.9rem; letter-spacing: 1px; }
    .numeral-item { font-size: 1.3rem; min-width: 68px; }

    #mimi-game-info {
      margin: 12px 0;
      font-size: 1rem;
      color: #90d0ff;
      font-weight: 600;
    }

    /* ============================================ */
    /* TIKO — QUEBRA-CABEÇA                         */
    /* ============================================ */
    .puzzle-wrapper {
      display: flex;
      justify-content: center;
      margin: 24px 0;
    }
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 320px;
      height: 320px;
      border: 4px solid #e6e05b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(230, 224, 91, 0.4);
      background: #040420;
    }
    .puzzle-tile {
      width: 100%;
      height: 100%;
      cursor: pointer;
      background-image: url('tiko_puzzle_image.png');
      background-size: 300% 300%;
      background-repeat: no-repeat;
      transition: filter 0.15s;
      border: 1px solid rgba(4, 4, 32, 0.6);
    }
    .puzzle-tile.empty {
      background-image: none;
      background-color: #040420;
      cursor: default;
      border: none;
    }
    .puzzle-tile:hover:not(.empty) {
      filter: brightness(1.25);
    }
    .puzzle-tile:focus-visible {
      outline: 4px solid #f2e884;
      outline-offset: -4px;
    }

    /* ============================================ */
    /* PETS FLUTUANTES                              */
    /* ============================================ */
    .floating-pet {
      position: fixed;
      width: 110px;
      height: auto;
      z-index: 0;
      opacity: 0.55;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
      pointer-events: none;
    }
    #pet-luna-float { top: 12%; left: 4%; animation: float-pet-wide-1 14s ease-in-out infinite; }
    #pet-bolt-float { top: 72%; left: 6%; transform: scaleX(-1); animation: float-pet-wide-2 16s ease-in-out infinite; }
    #pet-mimi-float { top: 16%; right: 5%; animation: float-pet-wide-3 15s ease-in-out infinite; }
    #pet-tiko-float { bottom: 6%; right: 12%; width: 130px; animation: float-pet-wide-4 17s ease-in-out infinite; }
    #pet-placeholder-float { bottom: 10%; left: 20%; width: 90px; opacity: 0.4; animation: float-pet-wide-5 13s ease-in-out infinite; }

    @keyframes float-pet-wide-1 { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(20px,15px) rotate(3deg); } 50% { transform: translate(0,30px) rotate(0); } 75% { transform: translate(-25px,15px) rotate(-3deg); } }
    @keyframes float-pet-wide-2 { 0%,100% { transform: translate(0,0) scaleX(-1); } 25% { transform: translate(-15px,20px) rotate(-2deg) scaleX(-1); } 50% { transform: translate(-30px,0) rotate(0) scaleX(-1); } 75% { transform: translate(-10px,-15px) rotate(2deg) scaleX(-1); } }
    @keyframes float-pet-wide-3 { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-15px,8px) rotate(-2deg); } 50% { transform: translate(8px,-25px) rotate(0); } 75% { transform: translate(25px,15px) rotate(3deg); } }
    @keyframes float-pet-wide-4 { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-25px,-15px) rotate(-3deg); } 50% { transform: translate(0,-30px) rotate(0); } 75% { transform: translate(30px,-20px) rotate(3deg); } }
    @keyframes float-pet-wide-5 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(8px,12px); } }

    /* ============================================ */
    /* RESPONSIVO                                   */
    /* ============================================ */
    @media (max-width: 1080px) {
      .mission-grid {
        flex-wrap: wrap;
        max-width: 720px;
      }
      .mission-square {
        flex: 1 1 calc(50% - 24px);
        max-width: none;
      }
    }

    @media (max-width: 560px) {
      .page-header { padding: 28px 16px 20px; }
      .mission-grid { gap: 16px; padding: 0 16px 40px; }
      .mission-square {
        flex: 1 1 100%;
        aspect-ratio: auto;
        min-height: 150px;
        padding: 18px 14px;
      }
      .modal-content { padding: 28px 18px 24px; }
      .planet { width: 72
