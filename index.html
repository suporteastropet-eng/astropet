<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#040420" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AstroPets" />
  <title>AstroPets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: radial-gradient(1200px 600px at 10% 20%, rgba(4,4,32,0.45), transparent 40%),
                  linear-gradient(120deg, #040420 0%, #0b0b3a 45%, #1a1a59 100%);
      background-color: #040420;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      color: #e7e9ff;
    }

    #stars {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .container {
      z-index: 1;
      text-align: center;
      padding: 20px;
      max-width: 520px;
      width: 100%;
    }

    .logo-text {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      color: #f2e884;
      text-shadow: 0 0 12px rgba(242, 232, 132, 0.35);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #a8c8f0;
      margin-bottom: 40px;
      line-height: 1.5;
      padding: 0 10px;
    }

    .start-button {
      padding: 18px 44px;
      background-color: #f2e884;
      color: #040420;
      border: 3px solid transparent;
      border-radius: 50px;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      min-width: 240px;
      min-height: 60px;
    }

    .start-button:hover { background-color: #fff5a8; transform: translateY(-2px); }
    .start-button:focus-visible { outline: 4px solid #90d0ff; outline-offset: 4px; }
    .start-button:active { transform: translateY(0); }

    .floating-pet {
      position: absolute;
      width: clamp(90px, 14vw, 140px);
      height: auto;
      z-index: 0;
      opacity: 0.55;
      filter: drop-shadow(0 0 8px rgba(0,0,0,0.4));
      pointer-events: none;
    }

    #pet-luna-float { top: 8%; left: 8%; animation: float-slow 14s ease-in-out infinite; }
    #pet-bolt-float { top: 62%; right: 8%; animation: float-slow 16s ease-in-out infinite reverse; }
    #pet-mimi-float { bottom: 10%; left: 6%; animation: float-slow 15s ease-in-out infinite 1s; }
    #pet-tiko-float { top: 12%; right: 6%; width: clamp(80px, 12vw, 120px); animation: float-slow 17s ease-in-out infinite 2s; }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }

    .install-area { margin-top: 28px; min-height: 48px; }
    .install-button {
      display: none;
      padding: 12px 26px;
      background: transparent;
      color: #a8c8f0;
      border: 2px solid #a8c8f0;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      min-height: 48px;
    }
    .install-button:hover { background: #a8c8f0; color: #040420; }
    .install-button:focus-visible { outline: 4px solid #f2e884; outline-offset: 3px; }

    .install-hint {
      display: none;
      max-width: 340px;
      margin: 0 auto;
      font-size: 0.95rem;
      color: #a8c8f0;
      line-height: 1.5;
      padding: 10px;
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-pet { animation: none; }
      .start-button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <img src="luna.png" alt="" class="floating-pet" id="pet-luna-float">
  <img src="Bolt.png" alt="" class="floating-pet" id="pet-bolt-float">
  <img src="mimi.png" alt="" class="floating-pet" id="pet-mimi-float">
  <img src="tiko.png" alt="" class="floating-pet" id="pet-tiko-float">

  <div class="container">
    <div class="logo-text">AstroPets</div>
    <div class="subtitle">Escolha uma missão e ajude os pets a explorar o espaço.</div>
    <button class="start-button" onclick="window.location.href='missao.html'">
      Começar
    </button>
    <div class="install-area">
      <button class="install-button" id="btn-instalar" type="button">📲 Instalar como app</button>
      <p class="install-hint" id="dica-ios">Para instalar: toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.3,
        o: Math.random()
      }));
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        const alpha = reduzirMovimento ? 0.85 : 0.7 + 0.3 * Math.sin(Date.now() / 1500 + s.o * 6.28);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script>
    (function () {
      const btn = document.getElementById('btn-instalar');
      const dicaIOS = document.getElementById('dica-ios');
      const jaInstalado = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (jaInstalado) return;

      let promptInstalar = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        promptInstalar = e;
        btn.style.display = 'inline-block';
      });
      btn.addEventListener('click', async () => {
        if (!promptInstalar) return;
        promptInstalar.prompt();
        await promptInstalar.userChoice;
        promptInstalar = null;
        btn.style.display = 'none';
      });
      window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });

      const ua = navigator.userAgent;
      const ehIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ehIOS) dicaIOS.style.display = 'block';
    })();
  </script>
</body>
</html>
